  <style>
    body {
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }
    /* Outline text effect */
    .text-outline {
      color: transparent;
      -webkit-text-stroke: 1px #000;
    }
    /* Custom cursor style */
    .cursor-circle {
      position: fixed;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      background-color: #ec4899; /* Tailwind pink-500 */
      border-radius: 9999px;
      pointer-events: none;
      mix-blend-mode: difference;
      z-index: 50;
      transition: transform 0.15s ease-out, width 0.15s, height 0.15s, background-color 0.15s;
    }
    .cursor-hover {
      transform: scale(2);
      background-color: white;
    }
        .list {
      display: flex;
      justify-content: space-between;
      padding: 50px 40px 0;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      box-sizing: border-box;
      flex-wrap: nowrap;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

  .list {
  display: flex;
  justify-content: center;
  gap: 8px; /* Smaller space between images */
  margin-top: 2.5rem; /* Matches mt-10 */
  overflow-x: auto;
  padding: 0 10px;
}

.item {
  position: relative;
  transform-style: preserve-3d;
  transform: translateZ(0);
  will-change: transform;
  transition: 0.5s cubic-bezier(.87, 1.38, .03, 1.54);
  filter: brightness(0.05);
  overflow: hidden;
  pointer-events: auto;
  width: 160px; /* match image width */
  height: 300px; /* ensure uniform height */
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 4px;
}

.list {
  display: flex;
  justify-content: center;
  gap: 8px; /* reduced space between images */
  overflow-x: auto;
  padding: 20px 40px;
  box-sizing: border-box;
}

.item {
  width: 160px; /* base width */
  height: 300px;
  transition: all 0.5s cubic-bezier(.87, 1.38, .03, 1.54);
  filter: grayscale(100%) brightness(0.6); /* grayscale and dim by default */
  flex-shrink: 0; /* prevent shrinking */
  border-radius: 4px;
  overflow: hidden;
}

.item:hover {
  width: 220px; /* expands on hover */
  filter: grayscale(0%) brightness(1); /* remove grayscale and brighten */
  z-index: 10; /* stack on top */
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 4px;
}

 <!-- Scripts -->
  <script>
    // ===== Fancy Cursor Logic =====
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.transform = `translate(${e.clientX - 12}px, ${e.clientY - 12}px)`;
    });

    // Enlarge cursor on hover
    const hoverables = document.querySelectorAll('a, button');
    hoverables.forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('cursor-hover'));
    });

    // ===== Mobile menu toggle =====
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

  

    function setLanguage(lang) {
      const t = texts[lang];
      // Navbar
      document.getElementById('nav-design').textContent = t.nav.design;
      document.getElementById('nav-photos').textContent = t.nav.photos;
      document.getElementById('nav-about').textContent = t.nav.about;
      document.getElementById('nav-contact').textContent = t.nav.contact;
      document.getElementById('m-nav-design').textContent = t.nav.design;
      document.getElementById('m-nav-photos').textContent = t.nav.photos;
      document.getElementById('m-nav-about').textContent = t.nav.about;
      document.getElementById('m-nav-contact').textContent = t.nav.contact;
      // Hero
      document.getElementById('intro-text').textContent = t.hero.intro;
      document.getElementById('hero-title').childNodes[0].nodeValue = t.hero.title + " ";
      document.getElementById('hero-subtitle').textContent = t.hero.subtitle;
      document.getElementById('location-text').textContent = t.hero.location;
      document.getElementById('btn-designer').textContent = t.hero.btn1;
      document.getElementById('btn-photographer').textContent = t.hero.btn2;
      // Highlight selected
      [btnEN, mBtnEN, btnFR, mBtnFR].forEach(b => b.classList.remove("text-black","border-b","border-black","font-semibold"));
      if (lang === "en") {
        btnEN.classList.add("text-black","border-b","border-black","font-semibold");
        mBtnEN.classList.add("text-black","border-b","border-black","font-semibold");
      } else {
        btnFR.classList.add("text-black","border-b","border-black","font-semibold");
        mBtnFR.classList.add("text-black","border-b","border-black","font-semibold");
      }
    }
